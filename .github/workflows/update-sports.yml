name: Update OWU sports live events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Collect OWU sports schedules
        run: |
          cat > update-sports.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          /*
           * OWU sports we want available in the dashboard.
           *
           * We scan the official OWU Athletics schedule for
           * each sport and keep games that expose Watch
           * and/or Live Stats links.
           */

          const SPORTS = [
            {
              name: "Women's Soccer",
              slug: "womens-soccer"
            },
            {
              name: "Men's Soccer",
              slug: "mens-soccer"
            },
            {
              name: "Football",
              slug: "football"
            },
            {
              name: "Volleyball",
              slug: "womens-volleyball"
            },
            {
              name: "Field Hockey",
              slug: "field-hockey"
            },
            {
              name: "Women's Basketball",
              slug: "womens-basketball"
            },
            {
              name: "Men's Basketball",
              slug: "mens-basketball"
            },
            {
              name: "Women's Lacrosse",
              slug: "womens-lacrosse"
            },
            {
              name: "Men's Lacrosse",
              slug: "mens-lacrosse"
            },
            {
              name: "Softball",
              slug: "softball"
            },
            {
              name: "Baseball",
              slug: "baseball"
            },
            {
              name: "Women's Swimming & Diving",
              slug: "womens-swimming-and-diving"
            },
            {
              name: "Men's Swimming & Diving",
              slug: "mens-swimming-and-diving"
            },
            {
              name: "Women's Track & Field",
              slug: "womens-track-and-field"
            },
            {
              name: "Men's Track & Field",
              slug: "mens-track-and-field"
            },
            {
              name: "Women's Tennis",
              slug: "womens-tennis"
            },
            {
              name: "Men's Tennis",
              slug: "mens-tennis"
            },
            {
              name: "Women's Golf",
              slug: "womens-golf"
            },
            {
              name: "Men's Golf",
              slug: "mens-golf"
            }
          ];

          const VIDEO_HOME =
            "https://www.northcoastnetwork.com/ohiowesleyan/";

          function clean(value) {
            return (value || "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluteUrl(href) {
            if (!href) return "";

            try {
              return new URL(
                href,
                "https://battlingbishops.com"
              ).href;
            } catch {
              return "";
            }
          }

          /*
           * Parse common OWU/Sidearm dates into something
           * sortable.
           *
           * If a date cannot be confidently parsed, we keep
           * the original display text and leave ISO blank.
           */

          function buildISO(dateText, timeText) {

            const combined =
              clean(`${dateText} ${timeText}`);

            if (!combined)
              return "";

            /*
             * Add the current year only if the page omitted it.
             */

            const currentYear =
              new Date().getFullYear();

            let candidate =
              combined;

            if (!/\b20\d{2}\b/.test(candidate)) {
              candidate += ` ${currentYear}`;
            }

            const parsed =
              new Date(candidate);

            if (
              Number.isNaN(
                parsed.getTime()
              )
            ) {
              return "";
            }

            return parsed.toISOString();
          }

          (async () => {

            const browser =
              await chromium.launch({
                headless: true
              });

            const context =
              await browser.newContext({
                viewport: {
                  width: 1600,
                  height: 1200
                }
              });

            const allEvents = [];

            for (const sport of SPORTS) {

              const page =
                await context.newPage();

              const scheduleUrl =
                `https://battlingbishops.com/sports/${sport.slug}/schedule`;

              console.log(
                `Scanning ${sport.name}: ${scheduleUrl}`
              );

              try {

                await page.goto(
                  scheduleUrl,
                  {
                    waitUntil: "domcontentloaded",
                    timeout: 60000
                  }
                );

                await page.waitForTimeout(2500);

                const events =
                  await page.evaluate(
                    ({ sportName, scheduleUrl }) => {

                      const clean = value =>
                        (value || "")
                          .replace(/\s+/g, " ")
                          .trim();

                      /*
                       * Sidearm normally uses
                       * .sidearm-schedule-game.
                       *
                       * We include several fallbacks in case
                       * OWU changes markup.
                       */

                      let rows = [
                        ...document.querySelectorAll(
                          [
                            ".sidearm-schedule-game",
                            ".sidearm-schedule-game-row",
                            "[class*='schedule-game']"
                          ].join(",")
                        )
                      ];

                      /*
                       * Deduplicate nested matches.
                       */

                      rows =
                        rows.filter(
                          (row,index,array) =>
                            !array.some(
                              (other,otherIndex) =>
                                otherIndex !== index &&
                                other.contains(row) &&
                                other !== row
                            )
                        );

                      const output = [];

                      for (const row of rows) {

                        const links = [
                          ...row.querySelectorAll("a")
                        ]
                        .map(a => ({
                          text: clean(
                            a.innerText ||
                            a.getAttribute("aria-label") ||
                            a.title
                          ),
                          href: a.href || ""
                        }));

                        const watch =
                          links.find(link =>
                            /watch|video|stream/i.test(
                              link.text
                            )
                          );

                        const stats =
                          links.find(link =>
                            /live stats|stats/i.test(
                              link.text
                            )
                          );

                        /*
                         * We are interested in games that have
                         * video and/or live statistics available.
                         */

                        if (!watch && !stats)
                          continue;


                        const opponentNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-opponent-name",
                              ".sidearm-schedule-game-opponent-text",
                              "[class*='opponent-name']"
                            ].join(",")
                          );


                        let opponent =
                          clean(
                            opponentNode?.innerText
                          );


                        /*
                         * Opponent selectors occasionally include
                         * "vs" or "at". Keep it readable.
                         */

                        opponent =
                          opponent
                            .replace(
                              /^(vs\.?|at)\s+/i,
                              ""
                            )
                            .trim();


                        const dateNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-opponent-date",
                              ".sidearm-schedule-game-date",
                              "[class*='game-date']",
                              "time"
                            ].join(",")
                          );


                        const timeNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-time",
                              "[class*='game-time']"
                            ].join(",")
                          );


                        const locationNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-location",
                              "[class*='location']"
                            ].join(",")
                          );


                        const resultNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-result",
                              "[class*='result']"
                            ].join(",")
                          );


                        const rowText =
                          clean(row.innerText);


                        const date =
                          clean(
                            dateNode?.innerText ||
                            dateNode?.getAttribute("datetime")
                          );


                        const time =
                          clean(
                            timeNode?.innerText
                          );


                        const location =
                          clean(
                            locationNode?.innerText
                          );


                        /*
                         * Try to determine home / away from the
                         * visible schedule row.
                         */

                        let site = "";

                        if (
                          /\bvs\.?\b/i.test(rowText)
                        ) {
                          site = "Home";
                        }

                        if (
                          /\bat\b/i.test(rowText)
                        ) {
                          site = "Away";
                        }


                        output.push({
                          sport: sportName,
                          opponent,
                          date,
                          time,
                          location,
                          site,
                          watchUrl:
                            watch?.href || "",
                          statsUrl:
                            stats?.href || "",
                          scheduleUrl
                        });
                      }

                      return output;

                    },
                    {
                      sportName:
                        sport.name,
                      scheduleUrl
                    }
                  );


                for (const event of events) {

                  event.watchUrl =
                    absoluteUrl(
                      event.watchUrl
                    );

                  event.statsUrl =
                    absoluteUrl(
                      event.statsUrl
                    );

                  event.isoDate =
                    buildISO(
                      event.date,
                      event.time
                    );

                  allEvents.push(event);
                }


                console.log(
                  `  Found ${events.length} stream/stat events`
                );

              }

              catch(error) {

                console.warn(
                  `Could not scan ${sport.name}:`,
                  error.message
                );

              }

              finally {

                await page.close();

              }
            }


            /*
             * Remove duplicate events.
             */

            const unique = [];

            const seen =
              new Set();

            for (const event of allEvents) {

              const key =
                [
                  event.sport,
                  event.date,
                  event.time,
                  event.opponent,
                  event.watchUrl
                ]
                .join("|")
                .toLowerCase();

              if (seen.has(key))
                continue;

              seen.add(key);

              unique.push(event);
            }


            /*
             * Sort events chronologically when possible.
             */

            unique.sort(
              (a,b) => {

                if (
                  a.isoDate &&
                  b.isoDate
                ) {
                  return (
                    new Date(a.isoDate) -
                    new Date(b.isoDate)
                  );
                }

                if (a.isoDate)
                  return -1;

                if (b.isoDate)
                  return 1;

                return 0;
              }
            );


            const result = {

              updatedAt:
                new Date().toISOString(),

              source:
                "https://battlingbishops.com/",

              videoHome:
                VIDEO_HOME,

              availableSports:
                SPORTS.map(
                  sport => sport.name
                ),

              events:
                unique
            };


            fs.writeFileSync(
              "sports.json",
              JSON.stringify(
                result,
                null,
                2
              )
              +
              "\n"
            );


            console.log(
              `Total OWU streaming/stat events found: ${unique.length}`
            );


            /*
             * Print the first few so the Actions log is useful.
             */

            console.log(
              JSON.stringify(
                unique.slice(0,10),
                null,
                2
              )
            );


            await browser.close();

          })().catch(error => {

            console.error(error);

            process.exit(1);

          });

          EOF

          node update-sports.js


      - name: Commit sports data if changed
        run: |

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add sports.json


          if git diff --cached --quiet; then

            echo "No sports changes found."

            exit 0

          fi


          git commit \
            -m "Auto-update OWU sports live events"


          git push
