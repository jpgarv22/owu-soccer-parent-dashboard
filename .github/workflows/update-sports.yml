name: Update OWU sports live events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Collect full OWU sports schedules
        run: |
          cat > update-sports.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          /*
           * OWU sports available in the dashboard.
           *
           * The order here is alphabetical with Men's sports first
           * followed by Women's sports. The dashboard itself can
           * alphabetize these when displaying the My Sports menu.
           */
          const SPORTS = [
            { name: "Men's Baseball", slug: "baseball" },
            { name: "Men's Basketball", slug: "mens-basketball" },
            { name: "Men's Football", slug: "football" },
            { name: "Men's Golf", slug: "mens-golf" },
            { name: "Men's Lacrosse", slug: "mens-lacrosse" },
            { name: "Men's Soccer", slug: "mens-soccer" },
            { name: "Men's Swimming & Diving", slug: "mens-swimming-and-diving" },
            { name: "Men's Tennis", slug: "mens-tennis" },
            { name: "Men's Track & Field", slug: "mens-track-and-field" },

            { name: "Women's Basketball", slug: "womens-basketball" },
            { name: "Women's Field Hockey", slug: "field-hockey" },
            { name: "Women's Golf", slug: "womens-golf" },
            { name: "Women's Lacrosse", slug: "womens-lacrosse" },
            { name: "Women's Soccer", slug: "womens-soccer" },
            { name: "Women's Softball", slug: "softball" },
            { name: "Women's Swimming & Diving", slug: "womens-swimming-and-diving" },
            { name: "Women's Tennis", slug: "womens-tennis" },
            { name: "Women's Track & Field", slug: "womens-track-and-field" },
            { name: "Women's Volleyball", slug: "womens-volleyball" }
          ];

          /*
           * Convert OWU date text into a dependable ISO date.
           *
           * Examples:
           *   "Sep 1 (Tue)"                -> 2026-09-01
           *   "May 1 (Fri) May 2 (Sat)"   -> 2026-05-01
           *   "Nov 21 (Sat)"              -> 2026-11-21
           *
           * We deliberately DO NOT use new Date(rawDateString).
           * JavaScript can interpret strings containing two day
           * numbers as a year, which caused 2026 events to become 2002.
           */
          function makeIsoDate(dateText, seasonYear) {
            if (!dateText) return "";

            const months = {
              jan: 0,
              feb: 1,
              mar: 2,
              apr: 3,
              may: 4,
              jun: 5,
              jul: 6,
              aug: 7,
              sep: 8,
              sept: 8,
              oct: 9,
              nov: 10,
              dec: 11
            };

            const cleaned = String(dateText)
              .replace(/\s+/g, " ")
              .trim();

            const match = cleaned.match(
              /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.?\s+(\d{1,2})\b/i
            );

            if (!match) return "";

            const month = months[match[1].toLowerCase()];
            const day = Number(match[2]);

            if (
              month === undefined ||
              !Number.isInteger(day) ||
              day < 1 ||
              day > 31
            ) {
              return "";
            }

            /*
             * OWU's current schedule pages are the 2026 season.
             * Use noon UTC instead of midnight to avoid accidental
             * date movement when browsers convert time zones.
             */
            return new Date(
              Date.UTC(seasonYear, month, day, 12, 0, 0)
            ).toISOString();
          }

          function cleanText(value) {
            return String(value || "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluteUrl(value, base) {
            if (!value) return "";

            try {
              return new URL(value, base).href;
            } catch {
              return "";
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1440,
                height: 1800
              }
            });

            const events = [];
            const seasonYear = 2026;

            for (const sport of SPORTS) {
              const scheduleUrl =
                `https://battlingbishops.com/sports/${sport.slug}/schedule/${seasonYear}`;

              console.log(`Reading ${sport.name}: ${scheduleUrl}`);

              try {
                await page.goto(scheduleUrl, {
                  waitUntil: "domcontentloaded",
                  timeout: 60000
                });

                await page.waitForTimeout(1200);

                /*
                 * Sidearm schedule pages have changed markup over time,
                 * so we look for several common schedule-item containers.
                 */
                const rawGames = await page.evaluate(() => {
                  const selectors = [
                    "li.sidearm-schedule-game",
                    ".sidearm-schedule-game",
                    ".sidearm-schedule-game-row",
                    ".sidearm-schedule-game-list-item",
                    "[class*='sidearm-schedule-game']"
                  ];

                  let nodes = [];

                  for (const selector of selectors) {
                    nodes = Array.from(
                      document.querySelectorAll(selector)
                    );

                    if (nodes.length) break;
                  }

                  return nodes.map(node => {
                    const text = selector => {
                      const el = node.querySelector(selector);
                      return el ? el.textContent.trim() : "";
                    };

                    const firstText = selectors => {
                      for (const selector of selectors) {
                        const value = text(selector);
                        if (value) return value;
                      }
                      return "";
                    };

                    const firstHref = selectors => {
                      for (const selector of selectors) {
                        const el = node.querySelector(selector);
                        if (el && el.href) return el.href;
                      }
                      return "";
                    };

                    const date = firstText([
                      ".sidearm-schedule-game-opponent-date",
                      ".sidearm-schedule-game-date",
                      "[class*='date']"
                    ]);

                    const time = firstText([
                      ".sidearm-schedule-game-opponent-time",
                      ".sidearm-schedule-game-time",
                      "[class*='time']"
                    ]);

                    const opponent = firstText([
                      ".sidearm-schedule-game-opponent-name",
                      ".sidearm-schedule-game-opponent-text",
                      "[class*='opponent-name']",
                      "[class*='opponent']"
                    ]);

                    const location = firstText([
                      ".sidearm-schedule-game-location",
                      "[class*='location']"
                    ]);

                    const watchUrl = firstHref([
                      "a[href*='northcoastnetwork']",
                      "a[aria-label*='Watch']",
                      "a[title*='Watch']",
                      "a[href*='watch']",
                      "a[href*='video']"
                    ]);

                    const statsUrl = firstHref([
                      "a[aria-label*='Live Stats']",
                      "a[title*='Live Stats']",
                      "a[href*='stats']",
                      "a[href*='sidearmstats']"
                    ]);

                    return {
                      date,
                      time,
                      opponent,
                      location,
                      watchUrl,
                      statsUrl,
                      allText: node.textContent || ""
                    };
                  });
                });

                for (const raw of rawGames) {
                  const date = cleanText(raw.date);
                  const time = cleanText(raw.time);
                  let opponent = cleanText(raw.opponent);
                  const location = cleanText(raw.location);

                  /*
                   * Skip blank/non-game containers accidentally returned
                   * by broad Sidearm selectors.
                   */
                  if (!date || !opponent) continue;

                  /*
                   * Remove some common schedule-page noise if it becomes
                   * attached to the opponent field.
                   */
                  opponent = opponent
                    .replace(/\s+/g, " ")
                    .trim();

                  const isoDate = makeIsoDate(date, seasonYear);

                  events.push({
                    sport: sport.name,
                    opponent,
                    date,
                    time,
                    location,
                    site:
                      /\bat\b/i.test(raw.allText || "")
                        ? "Away"
                        : "Home",
                    watchUrl: absoluteUrl(
                      raw.watchUrl,
                      scheduleUrl
                    ),
                    statsUrl: absoluteUrl(
                      raw.statsUrl,
                      scheduleUrl
                    ),
                    scheduleUrl,
                    isoDate
                  });
                }
              } catch (error) {
                console.error(
                  `Unable to read ${sport.name}:`,
                  error.message
                );
              }
            }

            /*
             * Remove duplicate schedule entries.
             */
            const uniqueMap = new Map();

            for (const event of events) {
              const key = [
                event.sport,
                event.opponent,
                event.date,
                event.time,
                event.location
              ]
                .join("|")
                .toLowerCase();

              if (!uniqueMap.has(key)) {
                uniqueMap.set(key, event);
              } else {
                /*
                 * If a duplicate contains a Watch or Stats URL that the
                 * first copy lacked, preserve the better information.
                 */
                const existing = uniqueMap.get(key);

                if (!existing.watchUrl && event.watchUrl) {
                  existing.watchUrl = event.watchUrl;
                }

                if (!existing.statsUrl && event.statsUrl) {
                  existing.statsUrl = event.statsUrl;
                }
              }
            }

            const unique = Array.from(uniqueMap.values());

            /*
             * Put valid dated events in chronological order.
             * Undated entries go to the bottom.
             */
            unique.sort((a, b) => {
              if (a.isoDate && b.isoDate) {
                return a.isoDate.localeCompare(b.isoDate);
              }

              if (a.isoDate) return -1;
              if (b.isoDate) return 1;

              return a.sport.localeCompare(b.sport);
            });

            const output = {
              updatedAt: new Date().toISOString(),
              source: "https://battlingbishops.com/",
              videoHome:
                "https://www.northcoastnetwork.com/ohiowesleyan/",
              availableSports: SPORTS
                .map(sport => sport.name)
                .sort((a, b) => a.localeCompare(b)),
              events: unique
            };

            fs.writeFileSync(
              "sports.json",
              JSON.stringify(output, null, 2)
            );

            console.log(
              `Saved ${unique.length} OWU sporting events to sports.json`
            );

            console.log(
              JSON.stringify(unique.slice(0, 20), null, 2)
            );

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node update-sports.js

      - name: Commit sports data if changed
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add sports.json

          if git diff --cached --quiet; then
            echo "No sports changes found."
            exit 0
          fi

          git commit \
            -m "Auto-update full OWU sports schedules"

          git push
