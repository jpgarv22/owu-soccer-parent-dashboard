name: Update OWU sports live events

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Collect full OWU sports schedules
        run: |
          cat > update-sports.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const YEAR = 2026;
          const BASE = "https://battlingbishops.com";
          const VIDEO_HOME = "https://www.northcoastnetwork.com/ohiowesleyan/";

          const SPORTS = [
            { name: "Men's Baseball", slug: "baseball" },
            { name: "Men's Basketball", slug: "mens-basketball" },
            { name: "Men's Football", slug: "football" },
            { name: "Men's Golf", slug: "mens-golf" },
            { name: "Men's Lacrosse", slug: "mens-lacrosse" },
            { name: "Men's Soccer", slug: "mens-soccer" },
            { name: "Men's Swimming & Diving", slug: "mens-swimming-and-diving" },
            { name: "Men's Tennis", slug: "mens-tennis" },
            { name: "Men's Track & Field", slug: "mens-track-and-field" },
            { name: "Women's Basketball", slug: "womens-basketball" },
            { name: "Women's Field Hockey", slug: "field-hockey" },
            { name: "Women's Golf", slug: "womens-golf" },
            { name: "Women's Lacrosse", slug: "womens-lacrosse" },
            { name: "Women's Soccer", slug: "womens-soccer" },
            { name: "Women's Softball", slug: "softball" },
            { name: "Women's Swimming & Diving", slug: "womens-swimming-and-diving" },
            { name: "Women's Tennis", slug: "womens-tennis" },
            { name: "Women's Track & Field", slug: "womens-track-and-field" },
            { name: "Women's Volleyball", slug: "womens-volleyball" }
          ];

          const clean = value => String(value || "")
            .replace(/\u00a0/g, " ")
            .replace(/\s+/g, " ")
            .trim();

          function absoluteUrl(value, base) {
            if (!value) return "";
            try { return new URL(value, base).href; }
            catch { return ""; }
          }

          function makeIsoDate(dateText) {
            const months = {
              jan:0,feb:1,mar:2,apr:3,may:4,jun:5,
              jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11
            };
            const match = clean(dateText).match(
              /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.?\s+(\d{1,2})\b/i
            );
            if (!match) return "";
            const month = months[match[1].toLowerCase()];
            const day = Number(match[2]);
            return new Date(Date.UTC(YEAR, month, day, 12, 0, 0)).toISOString();
          }

          function determineSite(text) {
            const t = clean(text).toLowerCase();
            if (/\bat\b/.test(t)) return "Away";
            if (/\bvs\.?\b/.test(t)) return "Home";
            return "";
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1800 } });
            const collected = [];

            for (const sport of SPORTS) {
              const scheduleUrl = `${BASE}/sports/${sport.slug}/schedule/${YEAR}`;
              console.log(`Reading ${sport.name}: ${scheduleUrl}`);

              try {
                await page.goto(scheduleUrl, {
                  waitUntil: "domcontentloaded",
                  timeout: 30000
                });
                await page.waitForTimeout(700);

                const games = await page.evaluate(() => {
                  const clean = value => String(value || "")
                    .replace(/\u00a0/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();

                  // Sidearm's real schedule entries are LI elements. Using the
                  // exact LI selector avoids accidentally choosing nested
                  // controls inside games that contain Watch/Live Stats links.
                  let rows = Array.from(
                    document.querySelectorAll("li.sidearm-schedule-game")
                  );

                  // Fallback only for sports whose page uses a slightly
                  // different top-level Sidearm element.
                  if (!rows.length) {
                    rows = Array.from(
                      document.querySelectorAll(".sidearm-schedule-game")
                    ).filter(el => !el.closest("li.sidearm-schedule-game"));
                  }

                  function firstText(row, selectors) {
                    for (const selector of selectors) {
                      const el = row.querySelector(selector);
                      const value = clean(el?.textContent);
                      if (value) return value;
                    }
                    return "";
                  }

                  function linkByMeaning(row, type) {
                    const links = Array.from(row.querySelectorAll("a[href]"));
                    for (const a of links) {
                      const href = a.href || "";
                      const label = clean([
                        a.textContent,
                        a.getAttribute("aria-label"),
                        a.getAttribute("title")
                      ].filter(Boolean).join(" ")).toLowerCase();
                      const combined = `${label} ${href.toLowerCase()}`;

                      if (type === "watch" &&
                          (/\bwatch\b/.test(combined) ||
                           combined.includes("northcoastnetwork") ||
                           combined.includes("video"))) return href;

                      if (type === "stats" &&
                          (combined.includes("live stats") ||
                           combined.includes("livestats") ||
                           combined.includes("sidearmstats") ||
                           combined.includes("/stats"))) return href;
                    }
                    return "";
                  }

                  return rows.map(row => {
                    const allText = clean(row.textContent);

                    let date = firstText(row, [
                      ".sidearm-schedule-game-opponent-date",
                      ".sidearm-schedule-game-date",
                      "[class*='game-date']"
                    ]);
                    if (!date) {
                      const m = allText.match(
                        /\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.?\s+\d{1,2}(?:\s+\([^)]*\))?(?:\s+(?:TBA|\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?)))?/i
                      );
                      date = m ? m[0] : "";
                    }

                    let time = firstText(row, [
                      ".sidearm-schedule-game-opponent-time",
                      ".sidearm-schedule-game-time",
                      "[class*='game-time']"
                    ]);
                    if (!time) {
                      const m = allText.match(
                        /\b(?:TBA|\d{1,2}(?::\d{2})?\s*(?:a\.?m\.?|p\.?m\.?))\b/i
                      );
                      time = m ? m[0] : "";
                    }

                    let opponent = firstText(row, [
                      ".sidearm-schedule-game-opponent-name",
                      ".sidearm-schedule-game-opponent-text",
                      "[class*='opponent-name']"
                    ]);
                    opponent = opponent.replace(/^(?:vs\.?|at)\s+/i, "").trim();

                    const location = firstText(row, [
                      ".sidearm-schedule-game-location",
                      "[class*='game-location']",
                      "[class*='location']"
                    ]);

                    return {
                      date,
                      time,
                      opponent,
                      location,
                      allText,
                      watchUrl: linkByMeaning(row, "watch"),
                      statsUrl: linkByMeaning(row, "stats")
                    };
                  });
                });

                console.log(`${sport.name}: ${games.length} top-level schedule rows`);

                for (const game of games) {
                  const date = clean(game.date);
                  const opponent = clean(game.opponent);
                  if (!date || !opponent) continue;

                  collected.push({
                    sport: sport.name,
                    opponent,
                    date,
                    time: clean(game.time),
                    location: clean(game.location),
                    site: determineSite(game.allText),
                    watchUrl: absoluteUrl(game.watchUrl, scheduleUrl),
                    statsUrl: absoluteUrl(game.statsUrl, scheduleUrl),
                    scheduleUrl,
                    isoDate: makeIsoDate(date)
                  });
                }
              } catch (error) {
                console.error(`ERROR ${sport.name}: ${error.message}`);
              }
            }

            const uniqueMap = new Map();
            for (const event of collected) {
              const key = [event.sport, event.date, event.opponent, event.location]
                .join("|").toLowerCase();
              if (!uniqueMap.has(key)) uniqueMap.set(key, event);
              else {
                const old = uniqueMap.get(key);
                if (!old.watchUrl && event.watchUrl) old.watchUrl = event.watchUrl;
                if (!old.statsUrl && event.statsUrl) old.statsUrl = event.statsUrl;
                if (!old.time && event.time) old.time = event.time;
              }
            }

            const events = Array.from(uniqueMap.values()).sort((a,b) => {
              if (a.isoDate && b.isoDate) return a.isoDate.localeCompare(b.isoDate);
              if (a.isoDate) return -1;
              if (b.isoDate) return 1;
              return a.sport.localeCompare(b.sport);
            });

            const output = {
              updatedAt: new Date().toISOString(),
              source: BASE,
              videoHome: VIDEO_HOME,
              availableSports: SPORTS.map(x => x.name).sort((a,b) => a.localeCompare(b)),
              events
            };

            fs.writeFileSync("sports.json", JSON.stringify(output, null, 2) + "\n");

            const wsoc = events.filter(e => e.sport === "Women's Soccer");
            console.log(`TOTAL EVENTS SAVED: ${events.length}`);
            console.log("WOMEN'S SOCCER:");
            console.log(JSON.stringify(wsoc.slice(0, 12), null, 2));

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF

          node update-sports.js

      - name: Commit sports data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports.json

          if git diff --cached --quiet; then
            echo "No sports changes found."
            exit 0
          fi

          git commit -m "Auto-update complete OWU sports schedules"
          git push
