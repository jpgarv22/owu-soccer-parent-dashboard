name: Update OWU sports schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-sports:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Collect OWU sports schedules
        run: |
          cat > update-sports.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const SPORTS = [
            { name: "Men's Baseball", slug: "baseball" },
            { name: "Men's Basketball", slug: "mens-basketball" },
            { name: "Men's Football", slug: "football" },
            { name: "Men's Golf", slug: "mens-golf" },
            { name: "Men's Lacrosse", slug: "mens-lacrosse" },
            { name: "Men's Soccer", slug: "mens-soccer" },
            { name: "Men's Swimming & Diving", slug: "mens-swimming-and-diving" },
            { name: "Men's Tennis", slug: "mens-tennis" },
            { name: "Men's Track & Field", slug: "mens-track-and-field" },

            { name: "Women's Basketball", slug: "womens-basketball" },
            { name: "Women's Field Hockey", slug: "field-hockey" },
            { name: "Women's Golf", slug: "womens-golf" },
            { name: "Women's Lacrosse", slug: "womens-lacrosse" },
            { name: "Women's Soccer", slug: "womens-soccer" },
            { name: "Women's Softball", slug: "softball" },
            { name: "Women's Swimming & Diving", slug: "womens-swimming-and-diving" },
            { name: "Women's Tennis", slug: "womens-tennis" },
            { name: "Women's Track & Field", slug: "womens-track-and-field" },
            { name: "Women's Volleyball", slug: "womens-volleyball" }
          ];

          const BASE = "https://battlingbishops.com";
          const VIDEO_HOME =
            "https://www.northcoastnetwork.com/ohiowesleyan/";

          function clean(value) {
            return (value || "")
              .replace(/\s+/g, " ")
              .trim();
          }

          function absoluteUrl(href) {
            if (!href) return "";

            try {
              return new URL(href, BASE).href;
            } catch {
              return "";
            }
          }

          function parseScheduleDate(dateText, timeText) {

            const text =
              clean(`${dateText} ${timeText}`);

            if (!text)
              return "";

            if (/TBA/i.test(text))
              return "";

            let normalized =
              text
                .replace(/\([^)]*\)/g, "")
                .replace(/\bp\.m\./gi, "PM")
                .replace(/\ba\.m\./gi, "AM")
                .replace(/\s+/g, " ")
                .trim();

            if (!/\b20\d{2}\b/.test(normalized)) {
              normalized += " 2026";
            }

            const parsed =
              new Date(normalized);

            if (Number.isNaN(parsed.getTime()))
              return "";

            return parsed.toISOString();
          }

          (async () => {

            const browser =
              await chromium.launch({
                headless: true
              });

            const context =
              await browser.newContext({
                viewport: {
                  width: 1600,
                  height: 1200
                }
              });

            const allEvents = [];

            for (const sport of SPORTS) {

              const page =
                await context.newPage();

              const scheduleUrl =
                `${BASE}/sports/${sport.slug}/schedule/2026`;

              console.log(
                `Scanning ${sport.name}: ${scheduleUrl}`
              );

              try {

                await page.goto(
                  scheduleUrl,
                  {
                    waitUntil: "domcontentloaded",
                    timeout: 60000
                  }
                );

                await page.waitForTimeout(2500);

                const events =
                  await page.evaluate(
                    ({ sportName, scheduleUrl }) => {

                      const clean = value =>
                        (value || "")
                          .replace(/\s+/g, " ")
                          .trim();

                      let rows = [
                        ...document.querySelectorAll(
                          ".sidearm-schedule-game"
                        )
                      ];

                      if (!rows.length) {

                        rows = [
                          ...document.querySelectorAll(
                            [
                              ".sidearm-schedule-game-row",
                              "[class*='schedule-game']"
                            ].join(",")
                          )
                        ];
                      }

                      const output = [];

                      for (const row of rows) {

                        const rowText =
                          clean(row.innerText);

                        if (!rowText)
                          continue;

                        const opponentNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-opponent-name",
                              ".sidearm-schedule-game-opponent-text",
                              "[class*='opponent-name']"
                            ].join(",")
                          );

                        let opponent =
                          clean(
                            opponentNode?.innerText
                          );

                        opponent =
                          opponent
                            .replace(/^(vs\.?|at)\s+/i, "")
                            .trim();

                        if (!opponent)
                          continue;

                        const dateNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-opponent-date",
                              ".sidearm-schedule-game-date",
                              "[class*='game-date']",
                              "time"
                            ].join(",")
                          );

                        const timeNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-time",
                              "[class*='game-time']"
                            ].join(",")
                          );

                        const locationNode =
                          row.querySelector(
                            [
                              ".sidearm-schedule-game-location",
                              "[class*='location']"
                            ].join(",")
                          );

                        const date =
                          clean(
                            dateNode?.innerText ||
                            dateNode?.getAttribute("datetime")
                          );

                        const time =
                          clean(
                            timeNode?.innerText
                          );

                        const location =
                          clean(
                            locationNode?.innerText
                          );

                        let site = "";

                        if (
                          /\bvs\.?\b/i.test(rowText)
                        ) {
                          site = "Home";
                        }

                        if (
                          /\bat\b/i.test(rowText)
                        ) {
                          site = "Away";
                        }

                        if (
                          /neutral/i.test(rowText)
                        ) {
                          site = "Neutral";
                        }

                        const links = [
                          ...row.querySelectorAll("a")
                        ]
                        .map(a => ({
                          text: clean(
                            a.innerText ||
                            a.getAttribute("aria-label") ||
                            a.title
                          ),
                          href: a.href || ""
                        }));

                        const watch =
                          links.find(
                            link =>
                              /watch|video|stream/i.test(
                                link.text
                              )
                          );

                        const stats =
                          links.find(
                            link =>
                              /live stats|stats/i.test(
                                link.text
                              )
                          );

                        output.push({
                          sport: sportName,
                          opponent,
                          date,
                          time,
                          location,
                          site,
                          watchUrl:
                            watch?.href || "",
                          statsUrl:
                            stats?.href || "",
                          scheduleUrl
                        });
                      }

                      return output;

                    },
                    {
                      sportName:
                        sport.name,
                      scheduleUrl
                    }
                  );

                for (const event of events) {

                  event.watchUrl =
                    absoluteUrl(
                      event.watchUrl
                    );

                  event.statsUrl =
                    absoluteUrl(
                      event.statsUrl
                    );

                  event.isoDate =
                    parseScheduleDate(
                      event.date,
                      event.time
                    );

                  allEvents.push(event);
                }

                console.log(
                  `Found ${events.length} ${sport.name} events`
                );

              }

              catch(error) {

                console.warn(
                  `Could not scan ${sport.name}:`,
                  error.message
                );

              }

              finally {

                await page.close();

              }
            }

            const unique = [];
            const seen = new Set();

            for (const event of allEvents) {

              const key =
                [
                  event.sport,
                  event.date,
                  event.time,
                  event.opponent,
                  event.location
                ]
                .join("|")
                .toLowerCase();

              if (seen.has(key))
                continue;

              seen.add(key);
              unique.push(event);
            }

            unique.sort(
              (a,b) => {

                if (
                  a.isoDate &&
                  b.isoDate
                ) {
                  return (
                    new Date(a.isoDate) -
                    new Date(b.isoDate)
                  );
                }

                if (a.isoDate)
                  return -1;

                if (b.isoDate)
                  return 1;

                return 0;
              }
            );

            const result = {

              updatedAt:
                new Date().toISOString(),

              source:
                BASE,

              videoHome:
                VIDEO_HOME,

              availableSports:
                SPORTS.map(
                  sport => sport.name
                ),

              events:
                unique
            };

            fs.writeFileSync(
              "sports.json",
              JSON.stringify(
                result,
                null,
                2
              )
              +
              "\n"
            );

            console.log(
              `TOTAL EVENTS FOUND: ${unique.length}`
            );

            console.log(
              JSON.stringify(
                unique.slice(0,20),
                null,
                2
              )
            );

            await browser.close();

          })().catch(error => {

            console.error(error);
            process.exit(1);

          });

          EOF

          node update-sports.js

      - name: Commit sports data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sports.json

          if git diff --cached --quiet; then
            echo "No sports changes found."
            exit 0
          fi

          git commit -m "Auto-update full OWU sports schedules"
          git push
